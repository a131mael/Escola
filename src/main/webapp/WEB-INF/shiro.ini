# =======================
# Shiro INI configuration
# =======================

[main]
# Objects and their properties are defined here, 
# Such as the securityManager, Realms and anything
# else needed to build the SecurityManager

#sha256Matcher = org.apache.shiro.authc.credential.Sha256CredentialsMatcher
myRealm = org.escola.auth.Realm
#myRealm.credentialsMatcher = $sha256Matcher
shiro.loginUrl = /index.xhtml

# "Manter logado" por 90 dias -- o login ja pedia rememberMe=true
# (UsernamePasswordToken), mas sem isso o cookie nao durava e o filtro
# "authc" nas urls exigia reautenticacao mesmo com o cookie presente
# (authc so aceita autenticado "de verdade", nao "lembrado" -- por isso
# as urls abaixo usam o filtro "user", que aceita os dois).
rememberMeCookie = org.apache.shiro.web.servlet.SimpleCookie
rememberMeCookie.name = rememberMe
rememberMeCookie.maxAge = 7776000
rememberMeManager = org.apache.shiro.web.mgt.CookieRememberMeManager
rememberMeManager.cookie = $rememberMeCookie
securityManager.rememberMeManager = $rememberMeManager

[users]
# The 'users' section is for simple deployments
# when you only need a small number of statically-defined 
# set of User accounts.

[roles]
# The 'roles' section is for simple deployments
# when you only need a small number of statically-defined
# roles.

[urls]
# The 'urls' section is used for url-based security
# in web applications.  We'll discuss 
#/page/** = user, roles[admin],roles[guest]
/logout = logout
/page/** = user
