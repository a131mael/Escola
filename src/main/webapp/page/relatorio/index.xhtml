<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/templates/templateADM.xhtml">

	<ui:define name="content">
		<h:form id="formRelatorioNFSe" style="width:100%; border:none"
			rendered="#{authController.hasPermission(authController.administrador,authController.secretaria)}">
			<p:growl id="messages" showDetail="true" />

			<h:panelGrid columns="1" style="width:100%">

				<h:panelGroup style="display:flex; align-items:center; gap:10px; margin-bottom:12px;">
					<p:outputLabel value="NFS-e emitidas em:" style="font-weight:bold;" />
					<p:selectOneMenu value="#{relatorioController.anoSelecionado}">
						<f:selectItems value="#{relatorioController.anosDisponiveis}" />
						<p:ajax update="formRelatorioNFSe" />
					</p:selectOneMenu>
					<h:outputText value="Total do ano: " style="margin-left:20px; font-weight:bold;" />
					<h:outputText value="#{relatorioController.totalNFSeAnoSelecionado}">
						<f:convertNumber type="currency" currencySymbol="R$ " locale="pt_BR" />
					</h:outputText>
					<p:commandButton value="Importar histórico do Sistema Nacional" icon="ui-icon-refresh"
						style="margin-left:30px;"
						action="#{relatorioController.importarHistoricoNFSe()}"
						update="formRelatorioNFSe" process="@this">
						<p:confirm header="Importar histórico"
							message="Buscar no Sistema Nacional de NFS-e todas as notas da empresa (manuais, do sistema antigo, etc.) e salvar as que ainda não estão aqui? Pode demorar alguns minutos."
							icon="ui-icon-alert" />
					</p:commandButton>
				</h:panelGroup>

				<p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
					<p:commandButton value="Sim" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
					<p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
				</p:confirmDialog>

				<p:dataTable value="#{relatorioController.resumoNFSePorMes}" var="mesResumo"
					styleClass="tabela" style="max-width:500px;">

					<p:column headerText="Mês">
						<p:commandLink value="#{mesResumo.nomeMes}"
							action="#{relatorioController.selecionarMesDetalheNFSe(mesResumo.mes)}"
							update="@form" process="@this" />
					</p:column>
					<p:column headerText="Qtd. Notas" style="text-align:center;">
						<h:outputText value="#{mesResumo.qtdNotas}" />
					</p:column>
					<p:column headerText="Valor Total" style="text-align:right;">
						<h:outputText value="#{mesResumo.valorTotal}">
							<f:convertNumber type="currency" currencySymbol="R$ " locale="pt_BR" />
						</h:outputText>
					</p:column>
				</p:dataTable>

				<h:panelGroup id="painelDetalheNFSe" style="margin-top:20px;">
					<h:panelGroup rendered="#{relatorioController.mesDetalheNFSe != null}">
						<p:outputLabel value="Notas emitidas em #{relatorioController.nomeMesDetalheNFSe}:"
							style="font-weight:bold; display:block; margin-bottom:8px;" />
						<p:dataTable value="#{relatorioController.notasDetalheMes}" var="nota"
							styleClass="tabela" style="max-width:900px;"
							emptyMessage="Nenhuma nota autorizada nesse mês">
							<p:column headerText="Aluno">
								<h:outputText value="#{relatorioController.getNomeAlunoNota(nota)}" />
							</p:column>
							<p:column headerText="Número">
								<h:outputText value="#{nota.numero}" />
							</p:column>
							<p:column headerText="Valor" style="text-align:right;">
								<h:outputText value="#{nota.valor}">
									<f:convertNumber type="currency" currencySymbol="R$ " locale="pt_BR" />
								</h:outputText>
							</p:column>
							<p:column headerText="Data autorização">
								<h:outputText value="#{nota.dataAutorizacao}">
									<f:convertDateTime pattern="dd/MM/yyyy HH:mm" timeZone="GMT-3" />
								</h:outputText>
							</p:column>
							<p:column headerText="Chave de acesso">
								<h:outputText value="#{nota.chaveAcesso}" style="font-size:11px;" />
							</p:column>
						</p:dataTable>
					</h:panelGroup>
				</h:panelGroup>

			</h:panelGrid>
		</h:form>
	</ui:define>
</ui:composition>
