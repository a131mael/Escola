<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/templates/templateADM.xhtml">

	<f:metadata>
		<f:viewParam name="id" value="#{eventoArrecadacaoDetalheController.id}" />
		<f:event type="preRenderView" listener="#{eventoArrecadacaoDetalheController.carregar}" />
	</f:metadata>

	<ui:define name="content">
		<h:form id="form" style="width:100%; border:none; padding:15px 20px; box-sizing:border-box;"
			rendered="#{authController.hasPermission(authController.administrador,authController.secretaria,authController.financeiro) and eventoArrecadacaoDetalheController.evento != null}">

			<p:growl id="msgs" showDetail="true" />

			<h2>#{eventoArrecadacaoDetalheController.evento.nome}</h2>

			<div style="display:flex; flex-wrap:wrap; align-items:flex-start; gap:18px; width:100%; padding:14px; margin-bottom:16px; border:1px solid #ddd; border-radius:6px; box-sizing:border-box;">
				<div style="flex:0 0 auto;">
					<h4 style="margin:0 0 10px 0;">Pix do evento</h4>
					<img src="data:image/png;base64,#{eventoArrecadacaoDetalheController.pixQrCodeBase64}"
						width="180" height="180" alt="QR Code Pix" style="display:block;" />
				</div>
				<div style="flex:1 1 600px; min-width:400px; padding-top:28px;">
					<textarea readonly="readonly" id="pixTextoArea" rows="3"
						style="width:100%; box-sizing:border-box; white-space:pre-wrap; word-break:break-all; resize:none; font-size:12px;"
						onclick="this.select();">#{eventoArrecadacaoDetalheController.pixCopiaECola}</textarea>
				</div>
			</div>

			<h3 style="margin-bottom:6px;">Geral</h3>
			<p:dataTable value="#{eventoArrecadacaoDetalheController.resumoGeralLista}" var="r" style="width:100%">
				<p:column headerText="Participantes"><h:outputText value="#{r.totalParticipantes}" /></p:column>
				<p:column headerText="Confirmados"><h:outputText value="#{r.confirmados}" /></p:column>
				<p:column headerText="Não confirmados"><h:outputText value="#{r.naoConfirmados}" /></p:column>
				<p:column headerText="Pagos"><h:outputText value="#{r.pagos}" /></p:column>
				<p:column headerText="Não pagos"><h:outputText value="#{r.naoPagos}" /></p:column>
				<p:column headerText="Esperado">
					<h:outputText value="#{r.totalEsperado}"><f:convertNumber type="currency" currencySymbol="R$ " /></h:outputText>
				</p:column>
				<p:column headerText="Arrecadado">
					<h:outputText value="#{r.totalArrecadado}"><f:convertNumber type="currency" currencySymbol="R$ " /></h:outputText>
				</p:column>
				<p:column headerText="%">
					<h:outputText value="#{r.percentualPago}"><f:convertNumber maxFractionDigits="1" /></h:outputText>%
				</p:column>
			</p:dataTable>

			<h3 style="margin-bottom:6px;">Por turma</h3>
			<p:dataTable value="#{eventoArrecadacaoDetalheController.resumoPorTurma}" var="r" style="width:100%">
				<p:column headerText="Turma"><h:outputText value="#{r.nomeTurma}" /></p:column>
				<p:column headerText="Participantes"><h:outputText value="#{r.totalParticipantes}" /></p:column>
				<p:column headerText="Confirmados"><h:outputText value="#{r.confirmados}" /></p:column>
				<p:column headerText="Não confirmados"><h:outputText value="#{r.naoConfirmados}" /></p:column>
				<p:column headerText="Pagos"><h:outputText value="#{r.pagos}" /></p:column>
				<p:column headerText="Não pagos"><h:outputText value="#{r.naoPagos}" /></p:column>
				<p:column headerText="Esperado">
					<h:outputText value="#{r.totalEsperado}"><f:convertNumber type="currency" currencySymbol="R$ " /></h:outputText>
				</p:column>
				<p:column headerText="Arrecadado">
					<h:outputText value="#{r.totalArrecadado}"><f:convertNumber type="currency" currencySymbol="R$ " /></h:outputText>
				</p:column>
				<p:column headerText="%">
					<h:outputText value="#{r.percentualPago}"><f:convertNumber maxFractionDigits="1" /></h:outputText>%
				</p:column>
			</p:dataTable>

			<!-- uma aba por turma quando o evento vale pra todas; se for turma unica, essa lista so tem 1 elemento -->
			<p:tabView id="tabViewTurmas" value="#{eventoArrecadacaoDetalheController.turmas}" var="turmaIter"
				style="width:100%" styleClass="tabsTurmaFontePequena">
				<p:tab title="#{eventoArrecadacaoDetalheController.getTituloTurma(turmaIter)}">
					<ui:include src="cmpParticipantesEvento.xhtml">
						<ui:param name="turmaAtual" value="#{turmaIter}" />
					</ui:include>
				</p:tab>
			</p:tabView>

			<p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
				<p:commandButton value="Sim" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
				<p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
			</p:confirmDialog>

		</h:form>

		<style type="text/css">
			.tabsTurmaFontePequena .ui-tabs-nav li a {
				font-size: 11px;
				padding: 6px 10px;
			}
		</style>

	</ui:define>
</ui:composition>
