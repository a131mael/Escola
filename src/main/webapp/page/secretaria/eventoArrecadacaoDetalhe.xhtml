<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/templates/templateADM.xhtml">

	<f:metadata>
		<f:viewParam name="id" value="#{eventoArrecadacaoDetalheController.id}" />
		<f:event type="preRenderView" listener="#{eventoArrecadacaoDetalheController.carregar}" />
	</f:metadata>

	<ui:define name="content">
		<h:form id="form"
			rendered="#{authController.hasPermission(authController.administrador,authController.secretaria,authController.financeiro) and eventoArrecadacaoDetalheController.evento != null}">

			<p:growl id="msgs" showDetail="true" />

			<h2>#{eventoArrecadacaoDetalheController.evento.nome}</h2>

			<p:commandButton value="Gerar Pix" icon="ui-icon-note"
				actionListener="#{eventoArrecadacaoDetalheController.gerarPix()}"
				oncomplete="PF('dlgPix').show(); desenharQrCode();" update=":form:pixTexto" />

			<p:tabView id="tabViewResumo">
				<p:tab id="tabResumo" title="Resumo">
					<h3>Geral</h3>
					<p:dataTable value="#{eventoArrecadacaoDetalheController.resumoGeralLista}" var="r">
						<p:column headerText="Participantes"><h:outputText value="#{r.totalParticipantes}" /></p:column>
						<p:column headerText="Confirmados"><h:outputText value="#{r.confirmados}" /></p:column>
						<p:column headerText="Não confirmados"><h:outputText value="#{r.naoConfirmados}" /></p:column>
						<p:column headerText="Pagos"><h:outputText value="#{r.pagos}" /></p:column>
						<p:column headerText="Não pagos"><h:outputText value="#{r.naoPagos}" /></p:column>
						<p:column headerText="Esperado">
							<h:outputText value="#{r.totalEsperado}"><f:convertNumber type="currency" currencySymbol="R$ " /></h:outputText>
						</p:column>
						<p:column headerText="Arrecadado">
							<h:outputText value="#{r.totalArrecadado}"><f:convertNumber type="currency" currencySymbol="R$ " /></h:outputText>
						</p:column>
						<p:column headerText="%">
							<h:outputText value="#{r.percentualPago}"><f:convertNumber maxFractionDigits="1" /></h:outputText>%
						</p:column>
					</p:dataTable>

					<h3>Por turma</h3>
					<p:dataTable value="#{eventoArrecadacaoDetalheController.resumoPorTurma}" var="r">
						<p:column headerText="Turma"><h:outputText value="#{r.nomeTurma}" /></p:column>
						<p:column headerText="Participantes"><h:outputText value="#{r.totalParticipantes}" /></p:column>
						<p:column headerText="Confirmados"><h:outputText value="#{r.confirmados}" /></p:column>
						<p:column headerText="Não confirmados"><h:outputText value="#{r.naoConfirmados}" /></p:column>
						<p:column headerText="Pagos"><h:outputText value="#{r.pagos}" /></p:column>
						<p:column headerText="Não pagos"><h:outputText value="#{r.naoPagos}" /></p:column>
						<p:column headerText="Esperado">
							<h:outputText value="#{r.totalEsperado}"><f:convertNumber type="currency" currencySymbol="R$ " /></h:outputText>
						</p:column>
						<p:column headerText="Arrecadado">
							<h:outputText value="#{r.totalArrecadado}"><f:convertNumber type="currency" currencySymbol="R$ " /></h:outputText>
						</p:column>
						<p:column headerText="%">
							<h:outputText value="#{r.percentualPago}"><f:convertNumber maxFractionDigits="1" /></h:outputText>%
						</p:column>
					</p:dataTable>
				</p:tab>
			</p:tabView>

			<!-- uma aba por turma quando o evento vale pra todas; se for turma unica, essa lista so tem 1 elemento -->
			<p:tabView id="tabViewTurmas" value="#{eventoArrecadacaoDetalheController.turmas}" var="turma">
				<p:tab title="#{turma.nome}">
					<ui:include src="cmpParticipantesEvento.xhtml">
						<ui:param name="turmaAtual" value="#{turma}" />
					</ui:include>
				</p:tab>
			</p:tabView>

			<p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
				<p:commandButton value="Sim" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
				<p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
			</p:confirmDialog>

		</h:form>

		<p:dialog header="Pix do evento" widgetVar="dlgPix" modal="true" width="320">
			<h:form id="formPix">
				<div id="qrCodePix" style="text-align:center; margin-bottom:10px"></div>
				<h:panelGroup id="pixTexto">
					<p:inputTextarea value="#{eventoArrecadacaoDetalheController.pixCopiaECola}"
						readonly="true" rows="4" style="width:280px" />
				</h:panelGroup>
			</h:form>
		</p:dialog>

		<h:outputScript library="js" name="qrcode.min.js" target="body" />
		<script type="text/javascript">
			function desenharQrCode() {
				var el = document.getElementById('qrCodePix');
				el.innerHTML = '';
				var texto = document.querySelector('#formPix\\:pixTexto textarea').value;
				new QRCode(el, { text: texto, width: 220, height: 220 });
			}
		</script>

	</ui:define>
</ui:composition>
